name: Build OpenTTD (Windows)

# Manual build of an OpenTTD source tree into a Windows openttd.exe.
#
# This intentionally mirrors the steps OpenTTD's own official release
# workflow (.github/workflows/release-windows.yml in OpenTTD/OpenTTD) uses
# for its "windows" job, so the resulting binary is built the same way as
# the one distributed from openttd.org. See BUILD_NOTES.md in this repo
# for the full rationale and the differences from the upstream workflow.

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Override: build an external repository instead of the vendored openttd/ in this repo (owner/repo, e.g. for comparison against upstream vanilla)'
        required: false
        default: ''
      source_ref:
        description: 'Git ref (tag/branch/commit) to build, only used together with source_repo'
        required: false
        default: '16.0-beta2'
      arch:
        description: 'Target architecture'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - x86
          - arm64

jobs:
  windows:
    name: Windows (${{ inputs.arch || 'x64' }})
    # windows-latest (not pinned): the vendored source is OpenTTD 16.0-beta2
    # since 2026-08-15 (see openttd/VENDORED_SOURCE.md) -- its C++20
    # EnumBitSet constexpr constructors need a newer MSVC than windows-2022
    # ships (hit as C2131 "expression did not evaluate to a constant" in
    # src/signal.cpp), and beta16 pulls its own newer vcpkg baseline, so the
    # old windows-2022 pin from the 15.3/breakpad era (see BUILD_NOTES.md
    # run #2, and the same pin still in effect on the backup-15.3-decouple
    # branch) no longer applies here.
    runs-on: windows-latest

    steps:
    - name: Checkout this repository (vendored OpenTTD source lives in openttd/)
      uses: actions/checkout@v6

    - name: Checkout external OpenTTD source (only if source_repo override given)
      if: inputs.source_repo != ''
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.source_repo }}
        ref: ${{ inputs.source_ref || '15.3' }}
        # Full history + tags, so CMake's FindVersion.cmake can run
        # `git describe`/`git name-rev` and detect the version the same
        # way it would for an official checkout (e.g. "15.3").
        fetch-depth: 0
        path: external-openttd-src

    - name: Select source directory
      shell: bash
      run: |
        if [ -n "${{ inputs.source_repo }}" ]; then
          echo "SOURCE_DIR=external-openttd-src" >> "$GITHUB_ENV"
        else
          echo "SOURCE_DIR=openttd" >> "$GITHUB_ENV"
        fi

    - name: Write custom version string (only for the vendored source)
      if: inputs.source_repo == ''
      shell: bash
      run: |
        # The vendored openttd/ has no .git of its own (see VENDORED_SOURCE.md),
        # so FindVersion.cmake would otherwise fall back to the generic
        # "norev0000" placeholder. Providing .ottdrev is FindVersion.cmake's
        # own supported override for exactly this case (see
        # cmake/scripts/FindVersion.cmake) -- it's read before the
        # norev0000 fallback, so this shows a readable, build-specific
        # string in the main menu / window title instead.
        printf 'Openttd 16 beta2 Decouple by Karel Mácha PRE-ALPHA FOR FUN #%s\t%s\t1\t%s\t0\t0\n' \
          "${{ github.run_number }}" \
          "$(date -u +%Y%m%d)" \
          "${GITHUB_SHA:0:10}" \
          > "${GITHUB_WORKSPACE}/${SOURCE_DIR}/.ottdrev"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Enable Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Install dependencies
      shell: bash
      run: |
        echo "::group::Install choco dependencies"
        # pandoc is optional (only used to generate COPYING.rtf in the
        # bundle, see BUILD_NOTES.md); don't fail the whole build if
        # Chocolatey's registry has a transient hiccup finding it.
        choco install pandoc || echo "pandoc install failed, continuing without it (optional dependency)"
        echo "::endgroup::"

        echo "::group::Install breakpad dependencies"
        cargo install --locked dump_syms
        echo "::endgroup::"

    - name: Install MSVC problem matcher
      uses: ammaraskar/msvc-problem-matcher@master

    - name: Configure developer command prompt for tools
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build tools
      shell: bash
      run: |
        mkdir build-host
        cd build-host

        echo "::group::CMake"
        cmake ${GITHUB_WORKSPACE}/${SOURCE_DIR} \
          -GNinja \
          -DOPTION_TOOLS_ONLY=ON \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . --target tools
        echo "::endgroup::"

    - name: Configure developer command prompt for ${{ inputs.arch || 'x64' }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.arch || 'x64' }}

    - name: Build OpenTTD
      shell: bash
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        cmake ${GITHUB_WORKSPACE}/${SOURCE_DIR} \
          -GNinja \
          -DVCPKG_TARGET_TRIPLET=${{ inputs.arch || 'x64' }}-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}" \
          -DHOST_BINARY_DIR=${GITHUB_WORKSPACE}/build-host \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . --target openttd
        echo "::endgroup::"

    - name: Create breakpad symbols
      shell: bash
      run: |
        cd build
        dump_syms openttd.pdb --inlines --store symbols

    - name: Create bundles
      shell: bash
      run: |
        cd ${GITHUB_WORKSPACE}/build

        echo "::group::Run CPack"
        cpack
        echo "::endgroup::"

        echo "::group::Move PDB and exe to symbols"
        PDB_FOLDER=$(find symbols -mindepth 2 -type d)
        cp openttd.pdb ${PDB_FOLDER}/

        EXE_FOLDER=symbols/openttd.exe/$(grep "INFO CODE_ID" symbols/*/*/openttd.sym | cut -d\  -f3)
        mkdir -p ${EXE_FOLDER}
        cp openttd.exe ${EXE_FOLDER}/
        echo "::endgroup::"

    - name: Store bundles
      uses: actions/upload-artifact@v5
      with:
        name: openttd-windows-${{ inputs.arch || 'x64' }}-run${{ github.run_number }}
        path: build/bundles
        retention-days: 14

    - name: Store raw exe
      uses: actions/upload-artifact@v5
      with:
        name: openttd-exe-${{ inputs.arch || 'x64' }}-run${{ github.run_number }}
        path: build/openttd.exe
        retention-days: 14

    - name: Store symbols
      uses: actions/upload-artifact@v5
      with:
        name: symbols-windows-${{ inputs.arch || 'x64' }}-run${{ github.run_number }}
        path: build/symbols
        retention-days: 14
